services:
  - type: web
    name: money-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Secrets: set these in the Render dashboard, never in this file.
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
